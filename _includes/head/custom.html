<!-- start custom head snippets -->

<link rel="icon" href="/images/sahngmin-yoo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">

<style>
  :root {
    --portfolio-ink: #172033;
    --portfolio-muted: #657187;
    --portfolio-blue: #2557d6;
    --portfolio-blue-dark: #173b91;
    --portfolio-blue-soft: #edf3ff;
    --portfolio-border: #dfe5ef;
    --portfolio-surface: #ffffff;
    --portfolio-canvas: #f7f9fc;
    --portfolio-radius: 0.9rem;
    --portfolio-shadow: 0 18px 50px rgba(25, 45, 85, 0.08);
  }

  html {
    scroll-behavior: smooth;
    scroll-padding-top: 5rem;
  }

  body {
    background:
      radial-gradient(circle at 85% 3%, rgba(37, 87, 214, 0.09), transparent 25rem),
      var(--portfolio-canvas);
    color: var(--portfolio-ink);
  }

  a {
    transition: color 160ms ease, background-color 160ms ease, border-color 160ms ease, transform 160ms ease;
  }

  .masthead {
    border-bottom: 1px solid rgba(223, 229, 239, 0.82);
    background: rgba(247, 249, 252, 0.86);
    box-shadow: none;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  #site-nav .visible-links a {
    color: #3f4b60;
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.01em;
  }

  #site-nav .visible-links a::before {
    height: 2px;
    background: var(--portfolio-blue);
  }

  #main {
    padding-top: 2.5rem;
    padding-bottom: 4rem;
  }

  .wide-home #main {
    max-width: 104rem;
    padding-right: clamp(1rem, 2.5vw, 3rem);
    padding-left: clamp(1rem, 2.5vw, 3rem);
  }

  .wide-home .masthead__inner-wrap,
  .wide-home .page__footer footer {
    max-width: 104rem;
  }

  .sidebar,
  .sidebar:hover,
  .sidebar:focus-within {
    opacity: 1;
    transition: none;
  }

  #site-nav .site-title {
    display: none;
  }

  #site-nav .visible-links {
    justify-content: flex-start;
  }

  #site-nav .visible-links > li:first-child > a {
    margin-left: 0;
  }

  .author__avatar a {
    display: block;
    width: 100%;
    max-width: 175px;
    overflow: hidden;
    border: 4px solid rgba(255, 255, 255, 0.95);
    border-radius: 1.35rem;
    box-shadow: var(--portfolio-shadow);
  }

  .author__avatar img {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    object-position: center;
    filter: none;
    opacity: 1;
    transform: scale(1.01);
  }

  .author__name {
    margin-top: 1rem;
    font-size: 1.15rem;
  }

  .author__name a {
    color: var(--portfolio-ink);
  }

  .author__headline {
    margin-top: 0.2rem;
    color: var(--portfolio-muted);
    font-size: 0.72rem;
    line-height: 1.35;
  }

  .author__urls-wrapper {
    margin-top: 0.85rem;
  }

  .author__urls a {
    color: #4c5870;
  }

  .page__inner-wrap {
    padding: clamp(1.4rem, 3vw, 3.1rem);
    border: 1px solid rgba(223, 229, 239, 0.92);
    border-radius: 1.35rem;
    background: rgba(255, 255, 255, 0.94);
    box-shadow: var(--portfolio-shadow);
  }

  .page__title {
    margin: 0;
    color: var(--portfolio-ink);
    font-size: clamp(2.25rem, 6vw, 4.35rem);
    line-height: 0.98;
    letter-spacing: -0.055em;
  }

  .page__title a {
    color: inherit;
    text-decoration: none;
  }

  /* `.page__content .hero-kicker`: the theme's `.page__content p` rule otherwise overrides margin and size. */
  .page__content .hero-kicker {
    margin: 1.15rem 0 1.35rem;
    color: var(--portfolio-blue);
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    line-height: 1.5;
    text-transform: uppercase;
  }

  .hero-lede {
    max-width: 68rem;
    margin: 0;
    color: #273248;
    font-size: clamp(1.05rem, 2.25vw, 1.38rem);
    line-height: 1.58;
    letter-spacing: -0.012em;
  }

  .hero-supporting {
    max-width: 60rem;
    margin-top: 1rem;
    color: var(--portfolio-muted);
    font-size: 0.88rem;
    line-height: 1.75;
  }

  .page__content h2 {
    position: relative;
    margin-top: 3.8rem;
    padding-bottom: 0.65rem;
    border-bottom: 1px solid var(--portfolio-border);
    color: var(--portfolio-ink);
    font-size: clamp(1.35rem, 3vw, 1.85rem);
    letter-spacing: -0.025em;
  }

  .page__content h2::after {
    position: absolute;
    bottom: -1px;
    left: 0;
    width: 3.25rem;
    height: 3px;
    border-radius: 3px;
    background: var(--portfolio-blue);
    content: "";
  }

  .page__content h3 {
    color: var(--portfolio-ink);
  }

  .impact-strip,
  .career-grid,
  .research-grid {
    display: grid;
    gap: 0.85rem;
    margin: 1.75rem 0 2rem;
  }

  .hero-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.65rem;
    margin: 1.5rem 0 2rem;
  }

  .hero-action {
    padding: 0.72rem 1.05rem;
    border: 1px solid var(--portfolio-blue);
    border-radius: 0.62rem;
    color: var(--portfolio-blue-dark);
    font-size: 0.8rem;
    font-weight: 700;
    text-decoration: none;
  }

  .hero-action:hover,
  .hero-action:focus {
    background: var(--portfolio-blue-soft);
    transform: translateY(-1px);
    text-decoration: none;
  }

  .hero-action--primary,
  .hero-action--primary:visited,
  .hero-action--primary:hover,
  .hero-action--primary:focus {
    background: var(--portfolio-blue);
    color: #fff;
  }

  .impact-strip {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .impact-strip > div {
    position: relative;
    overflow: hidden;
    padding: 1.05rem 0.75rem;
    border: 1px solid var(--portfolio-border);
    border-radius: var(--portfolio-radius);
    background: linear-gradient(145deg, #fff, #f4f7fc);
  }

  .impact-strip strong {
    display: block;
    color: var(--portfolio-blue-dark);
    font-size: 1.35rem;
    line-height: 1.15;
  }

  .impact-strip span,
  .career-card__date,
  .patent-status {
    color: var(--portfolio-muted);
    font-size: 0.7rem;
    letter-spacing: 0.02em;
  }

  .career-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .research-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .research-card {
    position: relative;
    display: flex;
    flex-direction: column;
    padding: 1.65rem 1.7rem 1.5rem;
    border: 1px solid var(--portfolio-border);
    border-radius: var(--portfolio-radius);
    background: linear-gradient(160deg, #fff 0%, #f8faff 100%);
    transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
  }

  .research-card:hover {
    border-color: #c9d6f2;
    box-shadow: 0 14px 34px rgba(25, 45, 85, 0.08);
    transform: translateY(-2px);
  }

  .research-card__index {
    position: absolute;
    top: 1.9rem;
    right: 1.7rem;
    color: #b0b9ca;
    font-family: var(--font-mono);
    font-size: 0.66rem;
    font-weight: 500;
    letter-spacing: 0.04em;
  }

  .research-card h3 {
    margin: 0 0 1rem;
    padding-right: 2.5rem;
    color: var(--portfolio-ink);
    font-family: var(--font-display);
    font-size: clamp(1.15rem, 1.9vw, 1.32rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.25;
  }

  .research-card__metric {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    padding: 0.75rem 0.95rem 0.8rem;
    border-left: 3px solid var(--portfolio-blue);
    border-radius: 0.2rem 0.55rem 0.55rem 0.2rem;
    background: var(--portfolio-blue-soft);
  }

  .research-card__metric span {
    color: #5d6b85;
    font-family: var(--font-mono);
    font-size: 0.64rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    line-height: 1.45;
    text-transform: uppercase;
  }

  .research-card__metric strong {
    color: var(--portfolio-blue-dark);
    font-family: var(--font-display);
    font-size: clamp(1.02rem, 1.6vw, 1.12rem);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.2;
  }

  .research-card p {
    margin: 1.05rem 0 0;
    color: #4a566b;
    font-size: 0.84rem;
    line-height: 1.72;
  }

  .research-card p strong {
    color: var(--portfolio-ink);
    font-weight: 600;
  }

  .research-card__tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin: auto 0 0;
    padding: 1.2rem 0 0;
    list-style: none;
  }

  .research-card__tags li {
    margin: 0;
    padding: 0.25rem 0.55rem;
    border: 1px solid #dde4f1;
    border-radius: 0.4rem;
    background: #fff;
    color: #3a4762;
    font-family: var(--font-mono);
    font-size: 0.62rem;
    font-weight: 500;
    letter-spacing: 0.01em;
    line-height: 1.4;
  }

  .career-card {
    padding: 1.05rem;
    border: 1px solid var(--portfolio-border);
    border-top: 0.22rem solid var(--portfolio-blue);
    border-radius: var(--portfolio-radius);
    background: var(--portfolio-surface);
  }

  .career-card h3 {
    margin: 0.4rem 0 0;
    font-size: 1.12rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.3;
  }

  /* `.page__content` prefix: the theme's `.page__content p` rule otherwise overrides size and margin. */
  .page__content .career-card__role {
    margin: 0.2rem 0 0.8rem;
    color: var(--portfolio-blue-dark);
    font-size: 0.84rem;
    font-weight: 500;
    line-height: 1.4;
  }

  .career-card p:last-child {
    margin-bottom: 0;
    font-size: 0.82rem;
  }

  .publication-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr));
    gap: 1rem;
    margin: 1.25rem 0 2rem;
  }

  /* auto-fill keeps empty tracks, so a lone card keeps the same column width as the grid above. */
  .publication-grid--fill {
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 22rem), 1fr));
  }

  .publication-card {
    overflow: hidden;
    border: 1px solid var(--portfolio-border);
    border-radius: var(--portfolio-radius);
    background: var(--portfolio-surface);
    box-shadow: 0 8px 26px rgba(25, 45, 85, 0.045);
  }

  .publication-card__visual {
    display: flex;
    height: 11.5rem;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border-bottom: 1px solid var(--portfolio-border);
    background: #f5f7fb;
  }

  .publication-card__visual img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .publication-card__body {
    padding: 1.15rem 1.2rem 1.25rem;
  }

  .publication-card__meta {
    color: var(--portfolio-blue);
    font-size: 0.66rem;
    font-weight: 800;
    letter-spacing: 0.07em;
    text-transform: uppercase;
  }

  .publication-card h4 {
    margin: 0.45rem 0 0.6rem;
    color: var(--portfolio-ink);
    font-size: 0.98rem;
    line-height: 1.4;
    letter-spacing: -0.015em;
  }

  .publication-card p {
    margin: 0;
    color: var(--portfolio-muted);
    font-size: 0.73rem;
    line-height: 1.55;
  }

  .publication-card__links {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 1rem;
    margin-top: 0.9rem;
  }

  .publication-card__links a {
    color: var(--portfolio-blue);
    font-size: 0.7rem;
    font-weight: 800;
    text-decoration: none;
  }

  .publication-card__links a:hover,
  .publication-card__links a:focus {
    color: var(--portfolio-blue-dark);
    text-decoration: underline;
  }

  .patent-list {
    margin-left: 0;
    padding-left: 0;
    list-style: none;
  }

  .patent-list li {
    display: grid;
    grid-template-columns: 7.5rem 1fr;
    gap: 0.8rem;
    padding: 0.8rem 0;
    border-bottom: 1px solid #e7ebf2;
  }

  .patent-list strong,
  .patent-list code {
    display: block;
  }

  .patent-list code {
    width: fit-content;
    margin-top: 0.25rem;
    font-size: 0.72rem;
  }

  .patent-list a {
    display: inline-block;
    margin-top: 0.35rem;
    font-size: 0.72rem;
    font-weight: 700;
  }

  .page__footer {
    background: #111a2d;
    color: #b8c2d5;
  }

  .page__footer a {
    color: #e8edf7;
  }

  /* Typography system: Inter for text, Space Grotesk for display, JetBrains Mono for metadata. */
  :root {
    --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-display: "Space Grotesk", "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    --font-title: "Plus Jakarta Sans", "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  body,
  input,
  button,
  .btn,
  .masthead__inner-wrap {
    font-family: var(--font-sans);
  }

  h1,
  h2,
  h3,
  h4,
  h5,
  h6,
  .page__title,
  .author__name,
  .impact-strip strong {
    font-family: var(--font-display);
  }

  .page__title {
    font-family: var(--font-title);
    font-weight: 700;
    letter-spacing: -0.04em;
    line-height: 1.12;
  }

  .page__content h2 {
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  tt,
  code,
  kbd,
  samp,
  pre,
  .hero-kicker,
  .career-card__date,
  .patent-status,
  .publication-card__meta {
    font-family: var(--font-mono);
  }

  .publication-card__meta {
    font-weight: 600;
    letter-spacing: 0.04em;
  }

  .career-card__date,
  .patent-status {
    font-size: 0.66rem;
    letter-spacing: 0;
  }

  @media (max-width: 900px) {
    .impact-strip {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .career-grid,
    .research-grid {
      grid-template-columns: 1fr;
    }
  }

  @media (min-width: 1024px) {
    .wide-home .page {
      padding-right: 0;
    }
  }

  @media (max-width: 1023px) {
    #main {
      padding-top: 1.2rem;
    }

    .page__inner-wrap {
      border-radius: 1rem;
    }

    .author__avatar {
      display: block;
      width: 64px;
      height: 80px;
    }

    .author__content {
      display: block;
      padding: 0;
    }

    .author__name {
      margin: 0.55rem 0 0;
    }

    .author__urls-wrapper {
      margin-top: 0.75rem;
    }
  }

  @media (max-width: 520px) {
    .page__inner-wrap {
      margin-right: -0.35rem;
      margin-left: -0.35rem;
      padding: 1.3rem;
    }

    .page__title {
      font-size: 2.55rem;
    }

    .impact-strip {
      gap: 0.6rem;
    }

    .impact-strip > div {
      padding: 0.9rem 0.45rem;
    }

    .patent-list li {
      grid-template-columns: 1fr;
      gap: 0.2rem;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    html {
      scroll-behavior: auto;
    }

    a {
      transition: none;
    }

    .masthead,
    #main,
    .initial-content,
    .search-content,
    .page__footer {
      -webkit-animation: none !important;
      animation: none !important;
    }
  }
</style>

<!-- end custom head snippets -->
